[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "state-conditioned-entropy-pooling"
version = "0.1.0"
description = "State-conditioned Flexible Probabilities and Entropy Pooling over physical scenario supports"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Saverio Lauriola"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
research = ["matplotlib>=3.7", "jupyter>=1.0"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
